name: APK test Avant Apres V2

on:
  workflow_dispatch:
  push:
    branches:
      - develop-v2

permissions:
  contents: read

jobs:
  build:
    name: Build APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Restore stable signing key
        env:
          V2_KEYSTORE_BASE64: ${{ secrets.V2_KEYSTORE_BASE64 }}
          V2_SIGNING_PASSWORD: ${{ secrets.V2_SIGNING_PASSWORD }}
        run: |
          if [ -z "$V2_KEYSTORE_BASE64" ] || [ -z "$V2_SIGNING_PASSWORD" ]; then
            echo "::error::Missing V2_KEYSTORE_BASE64 or V2_SIGNING_PASSWORD repository secret"
            exit 1
          fi
          printf '%s' "$V2_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/v2-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/v2-signing.jks" -storepass "$V2_SIGNING_PASSWORD" -alias avantapres-v2 > /dev/null

      - name: Harmonize V2 launcher icon with sage splash
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/recolor_v2_icon.py

      - name: Build debug APK (stable signature)
        env:
          V2_SIGNING_STORE_FILE: ${{ runner.temp }}/v2-signing.jks
          V2_SIGNING_PASSWORD: ${{ secrets.V2_SIGNING_PASSWORD }}
        run: flutter build apk --debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: avant-apres-v2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
